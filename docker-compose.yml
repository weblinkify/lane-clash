# Everything runs in containers. After changing package.json, add --build to rebuild the image:
#   docker compose run --rm --build test
services:
  # Vite dev server, reachable from a phone on the same Wi-Fi at http://<this-computer's-ip>:5173
  dev:
    build: { context: ., target: deps }
    command: npm run dev -- --host 0.0.0.0
    ports: ['5173:5173']
    volumes:
      - .:/app
      - /app/node_modules

  # Type check + unit tests with coverage
  test:
    build: { context: ., target: deps }
    command: sh -c "npm run typecheck && npm run test:coverage"
    volumes:
      - .:/app
      - /app/node_modules

  # Balance table: 200 bot-vs-bot matches.
  # Flags: docker compose run --rm sim npm run sim -- --seed 7 --matches 500
  sim:
    build: { context: ., target: deps }
    command: npm run sim
    volumes:
      - .:/app
      - /app/node_modules

  # Production build served by nginx at http://localhost:8080
  web:
    build: { context: ., target: runtime }
    ports: ['8080:80']

  # Playwright smoke test against the web container, in the official Playwright image.
  # It shares web's network so the game is at http://localhost, which browsers treat as a
  # secure origin; the service worker needs that.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    depends_on: [web]
    network_mode: service:web
    working_dir: /work
    environment:
      BASE_URL: http://localhost
      CI: ${CI:-}
    volumes:
      - .:/work
      - playwright_modules:/work/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

  # Records docs/gameplay.gif: the Playwright image plus ffmpeg.
  gif:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.65.1-noble
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/*
    depends_on: [web]
    network_mode: service:web
    working_dir: /work
    environment:
      BASE_URL: http://localhost
    volumes:
      - .:/work
      - playwright_modules:/work/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run gif"

volumes:
  # Linux node_modules for the Playwright containers, kept apart from the host's.
  playwright_modules:
