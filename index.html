<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b2a41" />
    <meta name="description" content="A two-minute, one-lane battler for your phone." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>Lane Clash</title>
  </head>
  <body>
    <div id="app">
      <div id="top"><span id="timer">2:00</span></div>

      <div id="hud">
        <div id="energy"><div id="energy-fill"></div><span id="energy-text">5</span></div>
        <div id="cards"></div>
      </div>
      <div id="overlay">
        <h1 id="overlay-title"></h1>
        <p id="overlay-sub"></p>
        <div id="overlay-buttons"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
