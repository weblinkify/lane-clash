name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Balance table
        run: npm run sim

  docker:
    name: Docker image and Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image (type check, unit tests and build run inside it)
        run: docker compose build web
      - name: Start the container
        run: docker compose up -d web
      - name: Playwright smoke test against the container
        run: docker compose run --rm e2e
      - name: Container logs
        if: failure()
        run: docker compose logs web
